<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankridge Assistant</title>
  <link rel="icon" type="image/png" href="/static/assets/favicon.png" />
  <link rel="stylesheet" href="/static/style.css?v=2" />
</head>
<body>
  <div class="app-container">

    <!-- Main Chat Area -->
    <main class="chat-area">
      <div class="chat-header">
        <div class="brand-group">
          <img class="brand-logo" src="/static/assets/rankridge-icon.png" alt="Rankridge" />
          <div class="brand-text">
            <h2>Rankridge Assistant</h2>
            <span>IIT-JEE &amp; NEET Counselling</span>
          </div>
        </div>
        <a class="wa-btn"
           href="https://wa.me/919100306666?text=Hi%2C%20I%20was%20chatting%20with%20the%20Rankridge%20Assistant%20and%20would%20like%20to%20talk%20to%20a%20counsellor."
           target="_blank" rel="noopener" aria-label="Talk to a counsellor on WhatsApp">
          <svg viewBox="0 0 448 512" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l119.7-31.4c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-156.5zM223.9 438.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-71 18.6L91 357.9l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
          </svg>
          <span class="wa-btn-label">Talk to counsellor</span>
        </a>
      </div>

    <div id="chat-messages" class="chat-messages">
       <div id="empty-state" class="empty-state">
        <img class="empty-state-logo" src="/static/assets/rankridge-icon.png" alt="Rankridge" />
        <h1>Hi, I'm your Rankridge Assistant</h1>
        <p>Ask me about our IIT-JEE &amp; NEET programs, mentoring, or admissions.</p>
      </div>
    </div>

      <div class="chat-input-area">
        <textarea
        id="message-input"
         placeholder="Ask about programs, admissions, mentoring..."
        rows="1"
         ></textarea>
         <button id="send-btn">Send</button>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/script.js?v=2"></script>
</body>
</html>
